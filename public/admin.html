<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Admin - Radio Importante</title>
    <link rel="stylesheet" href="admin/styles/reset.css">
    <link rel="stylesheet" href="admin/styles/base.css">
    <link rel="stylesheet" href="admin/styles/components.css">
    <link rel="stylesheet" href="admin/styles/layout.css">
    <link rel="stylesheet" href="admin/styles/admin.css">
    <script type="module" src="admin/scripts/admin.js"></script>
    <script type="module" src="admin/test-integration.js"></script>
</head>
<body>
    <div class="container">
        <h1>🎵 Radio Importante - Admin</h1>
        
        <!-- Status do Backend -->
        <div class="status-panel">
            <div id="backend-status">🔍 Verificando backend...</div>
        </div>
        
        <!-- Navegação Tabs -->
        <div class="tabs">
            <button class="tab active" onclick="switchTab('upload')">📤 Upload</button>
            <button class="tab" onclick="switchTab('manage')">🎵 Gerenciar</button>
        </div>
        
        <!-- Tab de Upload -->
        <div id="upload-tab" class="tab-content active">
            <h2>Upload de Músicas</h2>
            <div id="upload-status"></div>
            <!-- Upload será implementado depois -->
        </div>
        
        <!-- Tab de Gerenciamento -->
        <div id="manage-tab" class="tab-content">
            <h2>Gerenciar Músicas</h2>
            <div id="music-list">
                <!-- Lista será carregada dinamicamente -->
            </div>
            <div id="manage-status"></div>
        </div>
    </div>

    <!-- Container para notificações -->
    <div id="notifications-container"></div>

    <script>
        // Funções básicas para tabs
        function switchTab(tabName) {
            // Remove active de todas as tabs
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
            });
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });
            
            // Ativa a tab selecionada
            const activeTab = document.querySelector(`[onclick="switchTab('${tabName}')"]`);
            const activeContent = document.getElementById(`${tabName}-tab`);
            
            if (activeTab && activeContent) {
                activeTab.classList.add('active');
                activeContent.classList.add('active');
            }
        }
    </script>
</body>
</html>
