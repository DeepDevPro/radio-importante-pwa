<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>The Ern</title>

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
  <link rel="apple-touch-icon" href="/icons/icon-192x192.svg" />

  <style>
    /* Reset e base - totalmente isolados para a rota /hometest */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #EFEAE3;
      color: #271F30;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      overscroll-behavior: none;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    /* Container principal da página */
    .hometest-container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    /* Bloco do Logo */
    .logo-section {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 60px;
    }

    .the-ern-logo {
      width: 137px;
      height: auto;
      display: block;
      opacity: 0.95;
      filter: drop-shadow(0 2px 4px rgba(39, 31, 48, 0.12));
      transition: transform 0.3s ease, opacity 0.3s ease;
    }

    .the-ern-logo:hover {
      opacity: 1;
      transform: scale(1.03);
    }

    /* Container das opções lado a lado (Xícara e Taça) */
    .actions-grid {
      display: flex;
      flex-direction: row;
      justify-content: center;
      align-items: center;
      gap: 56px;
      width: 100%;
    }

    /* Item de ação individual (Link envolto no SVG) */
    .action-link {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: #271F30;
      padding: 18px;
      border-radius: 20px;
      background: transparent;
      cursor: pointer;
      position: relative;
      transition: transform 0.25s cubic-bezier(0.2, 0, 0, 1), background-color 0.25s ease, opacity 0.2s ease;
    }

    /* SVG estilizado com traço elegante na cor do projeto */
    .action-icon {
      width: 72px;
      height: 72px;
      stroke: #271F30;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.25s ease, transform 0.25s ease;
    }

    /* Efeitos de Hover e Toque */
    .action-link:hover {
      transform: translateY(-4px) scale(1.08);
      background-color: rgba(39, 31, 48, 0.04);
    }

    .action-link:hover .action-icon {
      stroke-width: 2.1;
    }

    .action-link:active {
      transform: scale(0.96);
      background-color: rgba(39, 31, 48, 0.08);
    }

    /* Adaptação Responsiva Mobile (≤ 480px) */
    @media (max-width: 480px) {
      body {
        justify-content: flex-start;
        padding: 0 20px;
      }

      .hometest-container {
        height: 100vh;
        min-height: 100vh;
        justify-content: flex-start;
      }

      .logo-section {
        margin-top: 100px; /* Mesma calibragem da home mobile */
        margin-bottom: 70px;
      }

      .the-ern-logo {
        width: 105px; /* Mesma calibragem da home mobile */
      }

      .actions-grid {
        gap: 44px;
      }

      .action-icon {
        width: 68px;
        height: 68px;
      }

      .action-link {
        padding: 16px;
      }
    }
  </style>
</head>
<body>

  <main class="hometest-container">
    
    <!-- Topo: Logo oficial The Ern -->
    <header class="logo-section">
      <img 
        src="/icons/logo-theern-vertical.png" 
        alt="The Ern" 
        class="the-ern-logo"
      />
    </header>

    <!-- Centro: As duas escolhas lado a lado -->
    <section class="actions-grid" aria-label="Escolhas de Experiência">
      
      <!-- Coluna da Esquerda: Xícara de Café -->
      <a href="#" class="action-link" id="link-cafe" aria-label="Café" title="Café">
        <svg class="action-icon" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
          <!-- Pires inferior -->
          <path d="M12 50 C12 50, 18 54, 32 54 C46 54, 52 50, 52 50" />
          <line x1="8" y1="50" x2="56" y2="50" />
          <!-- Corpo da xícara -->
          <path d="M16 26 L18 43 C18.5 47 24 48.5 32 48.5 C40 48.5 45.5 47 46 43 L48 26 Z" />
          <!-- Borda superior da xícara -->
          <ellipse cx="32" cy="26" rx="16" ry="3.5" />
          <!-- Asa/Alça da xícara -->
          <path d="M47.5 29 C52.5 29, 55 33, 54.5 37 C54 41, 50 43, 46.2 42.5" />
          <!-- Vapores aromáticos sutis -->
          <path d="M26 18 C25 15, 27 13, 26 10" />
          <path d="M32 17 C31 14, 33 12, 32 9" />
          <path d="M38 18 C37 15, 39 13, 38 10" />
        </svg>
      </a>

      <!-- Coluna da Direita: Taça de Vinho -->
      <a href="#" class="action-link" id="link-vinho" aria-label="Vinho" title="Vinho">
        <svg class="action-icon" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
          <!-- Base da taça -->
          <path d="M20 54 C24 53.5, 40 53.5, 44 54" />
          <line x1="18" y1="54" x2="46" y2="54" />
          <!-- Haste da taça -->
          <line x1="32" y1="39" x2="32" y2="54" />
          <!-- Bojo / Cálice da taça -->
          <path d="M20 16 L20 27 C20 36, 26 39, 32 39 C38 39, 44 36, 44 27 L44 16 Z" />
          <!-- Borda superior da taça -->
          <ellipse cx="32" cy="16" rx="12" ry="2.8" />
          <!-- Nível suave de vinho no interior -->
          <path d="M21 26 C24 28, 40 28, 43 26" stroke-dasharray="0.5 1" opacity="0.6" />
        </svg>
      </a>

    </section>

  </main>

</body>
</html>
