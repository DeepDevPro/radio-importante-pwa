name: Deploy Backend to Staging

on:
  push:
    branches: [ "staging" ]
    paths:
      - "server/**"
      - ".github/workflows/deploy-backend-staging.yml"
  workflow_dispatch:

concurrency:
  group: deploy-backend-staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Verify App Configuration
        run: |
          echo "🔍 Attempting deploy to DigitalOcean App: rd-importante-backend-staging"
          echo "📋 Environment: staging backend"
          echo "🔗 Expected URL: https://rd-importante-backend-staging-cudbw.ondigitalocean.app/"
          echo "📦 Repository: ${{ github.repository }}"
          echo "🌿 Branch: ${{ github.ref_name }}"
        
      - name: Deploy Backend to Digital Ocean Staging
        id: deploy
        continue-on-error: true
        uses: digitalocean/app_action@v1.1.5
        with:
          app_name: rd-importante-backend-staging
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          
      - name: Handle Deploy Result
        run: |
          if [ "${{ steps.deploy.outcome }}" = "success" ]; then
            echo "✅ Backend staging deploy completed successfully!"
            echo "🔗 URL: https://rd-importante-backend-staging-cudbw.ondigitalocean.app/"
            echo "📋 Environment: staging backend"
            echo "📦 App name: rd-importante-backend-staging"
            echo "🔄 Updated with server/ directory structure"
          else
            echo "❌ Deploy failed!"
            echo ""
            echo "🔧 TROUBLESHOOTING:"
            echo "1. Verify App Spec has been updated with correct names"
            echo "2. Check DIGITALOCEAN_ACCESS_TOKEN has Apps:write permissions"
            echo "3. Ensure app 'rd-importante-backend-staging' exists in DigitalOcean"
            echo "4. Verify GitHub integration is properly configured"
            exit 1
          fi
