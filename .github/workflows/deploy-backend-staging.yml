name: Deploy Backend to Staging

on:
  push:
    branches: [ "staging" ]
    paths:
      - "server/**"
      - ".github/workflows/deploy-backend-staging.yml"
  workflow_dispatch:

concurrency:
  group: deploy-backend-staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Verify App Configuration
        run: |
          echo "🔍 Attempting deploy to DigitalOcean App: stingray-app-backend-staging-4wpcx"
          echo "📋 Environment: staging backend"
          echo "🔗 Expected URL: https://stingray-app-backend-staging-4wpcx.ondigitalocean.app/"
          echo "📦 Repository: ${{ github.repository }}"
          echo "🌿 Branch: ${{ github.ref_name }}"
          echo ""
          echo "⚠️  POTENTIAL ISSUE: App Spec shows name 'radio-importante-backend-staging'"
          echo "⚠️  But actual URL uses 'stingray-app-backend-staging-4wpcx'"
          echo "⚠️  This name mismatch may cause deployment failures"
        
      - name: Deploy Backend to Digital Ocean Staging
        id: deploy
        continue-on-error: true
        uses: digitalocean/app_action@v1.1.5
        with:
          app_name: stingray-app-backend-staging-4wpcx
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          
      - name: Handle Deploy Result
        run: |
          if [ "${{ steps.deploy.outcome }}" = "success" ]; then
            echo "✅ Backend staging deploy completed successfully!"
            echo "🔗 URL: https://stingray-app-backend-staging-4wpcx.ondigitalocean.app/"
            echo "📋 Environment: staging backend"
            echo "📦 App name: stingray-app-backend-staging-4wpcx"
            echo "🔄 Updated with server/ directory structure"
          else
            echo "❌ Deploy failed - Name mismatch detected!"
            echo ""
            echo "🔧 SOLUTIONS:"
            echo "1. Update App Spec name from 'radio-importante-backend-staging' to 'stingray-app-backend-staging-4wpcx'"
            echo "2. OR rename app in DigitalOcean to match spec: 'radio-importante-backend-staging'"  
            echo "3. Verify DIGITALOCEAN_ACCESS_TOKEN has Apps:write permissions"
            echo ""
            echo "� Current App Spec shows:"
            echo "   name: radio-importante-backend-staging"
            echo "   service.name: radio-importante-backend-staging"
            echo ""
            echo "📋 But GitHub Actions expects:"
            echo "   app_name: stingray-app-backend-staging-4wpcx"
            exit 1
          fi
