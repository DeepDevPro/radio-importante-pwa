name: Deploy Backend to Production

on:
  push:
    branches: [ "main" ]
    paths:
      - "server/**"
      - ".github/workflows/deploy-backend-production.yml"
  workflow_dispatch:

concurrency:
  group: deploy-backend-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Deploy Backend to Digital Ocean Production
        uses: digitalocean/app_action@v1.1.5
        with:
          app_name: radio-importante-pwa-backend-skg2w
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          
      - name: Notify Backend Deploy Success
        run: |
          echo "🚀 Backend production deploy completed successfully!"
          echo "🔗 URL: https://radio-importante-pwa-backend-skg2w.ondigitalocean.app/"
          echo "📋 Environment: production backend"
          echo "📦 App name: radio-importante-pwa-backend-skg2w"
          echo "🔄 Updated with server/ directory structure"
