name: Deploy Backend to Production

on:
  push:
    branches: [ "main" ]
    paths:
      - "server/**"
      - ".github/workflows/deploy-backend-production.yml"
  workflow_dispatch:

concurrency:
  group: deploy-backend-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Verify App Configuration
        run: |
          echo "🔍 Attempting deploy to DigitalOcean App: radio-importante-pwa-backend"
          echo "📋 Environment: production backend"
          echo "🔗 Expected URL: https://radio-importante-pwa-backend-skg2w.ondigitalocean.app/"
          echo "📦 Repository: ${{ github.repository }}"
          echo "🌿 Branch: ${{ github.ref_name }}"
          
      - name: Test DigitalOcean API Access
        run: |
          echo "🔧 Testing DigitalOcean API access..."
          curl -X GET \
            -H "Authorization: Bearer ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}" \
            -H "Content-Type: application/json" \
            "https://api.digitalocean.com/v2/apps" \
            | jq -r '.apps[] | select(.spec.name=="radio-importante-pwa-backend") | .id' || echo "API test failed"
          
      - name: Deploy Backend to Digital Ocean Production
        id: deploy
        continue-on-error: true
        uses: digitalocean/app_action/deploy@v2
        with:
          app_name: radio-importante-pwa-backend
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          
      - name: Debug Deploy Result
        if: steps.deploy.outcome == 'failure'
        run: |
          echo "🔍 Deploy failed, gathering debug info..."
          echo "Deploy step outcome: ${{ steps.deploy.outcome }}"
          echo "Deploy step outputs: ${{ toJSON(steps.deploy.outputs) }}"
          echo ""
          echo "🔧 Checking if app exists via API..."
          curl -X GET \
            -H "Authorization: Bearer ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}" \
            -H "Content-Type: application/json" \
            "https://api.digitalocean.com/v2/apps" | jq '.apps[] | {id, spec: {name: .spec.name}}'
          
      - name: Handle Deploy Result
        run: |
          if [ "${{ steps.deploy.outcome }}" = "success" ]; then
            echo "✅ Backend production deploy completed successfully!"
            echo "🔗 URL: https://radio-importante-pwa-backend.ondigitalocean.app/"
            echo "📋 Environment: production backend"
            echo "📦 App name: radio-importante-pwa-backend"
            echo "🔄 Updated with server/ directory structure"
          else
            echo "❌ Deploy failed - App may need manual configuration in DigitalOcean"
            echo "🔧 Check if app 'radio-importante-pwa-backend' exists and has GitHub integration"
            echo "🔧 Verify DIGITALOCEAN_ACCESS_TOKEN has sufficient permissions"
            echo "🔧 App should be configured to build from /server directory"
            exit 1
          fi
