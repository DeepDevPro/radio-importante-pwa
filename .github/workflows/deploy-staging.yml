name: Deploy to Staging

on:
  push:
    branches: [ "staging" ]
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "admin.html"
      - "admin-*.html"
      - "vite.config.ts"
      - "package.json"
      - "package-lock.json"
      - "styles/**"
      - "scripts/**"
  workflow_dispatch:

concurrency:
  group: deploy-staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Deploy to Digital Ocean Staging
        uses: digitalocean/app_action@v1.1.5
        with:
          app_name: radio-importante-frontend-staging
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          
      - name: Notify Staging Deploy
        run: |
          echo "🚧 Staging deploy completed!"
          echo "URL: https://radio-importante-frontend-stagin-6rjzv.ondigitalocean.app/"
