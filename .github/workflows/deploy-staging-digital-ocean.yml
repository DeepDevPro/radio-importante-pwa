name: Deploy to Staging (Digital Ocean)

# Force workflow recognition - updated timestamp
# Last update: 2025-09-19 17:45

on:
  push:
    branches: [ "staging" ]
  workflow_dispatch:

concurrency:
  group: deploy-staging-do-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-to-digital-ocean:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Deploy to Digital Ocean Staging
        uses: digitalocean/app_action@v1.1.5
        with:
          app_name: radio-importante-frontend-stagin
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          
      - name: Notify Staging Deploy Success
        run: |
          echo "🚧 Staging deploy completed successfully!"
          echo "🔗 URL: https://radio-importante-frontend-stagin-6rjzv.ondigitalocean.app/"
          echo "📋 Environment: staging"
          echo "📦 App name: radio-importante-frontend-stagin"
