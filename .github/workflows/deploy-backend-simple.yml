name: 🚀 Deploy Backend Simple

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  deploy-backend:
    name: 🏗️ Deploy Backend Simple
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
        
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
    
    - name: 🟢 Setup Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: './backend/package-lock.json'
        
    - name: 📦 Install dependencies
      run: npm ci
      
    - name: 🔧 Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-west-2

    - name: 📋 Install EB CLI
      run: pip install awsebcli
        
    - name: 🚀 Deploy via EB CLI Direct
      run: |
        echo "=== Deploy Direto via EB CLI ==="
        
        # Verificar arquivos essenciais
        echo "=== Verificando estrutura ==="
        ls -la package.json app.js Procfile || echo "Arquivos não encontrados"
        
        # Mostrar conteúdo do Procfile
        echo "=== Procfile ==="
        cat Procfile || echo "Procfile não encontrado"
        
        # Inicializar EB
        eb init radio-importante-backend --region us-west-2
        
        # Fazer deploy com label único
        LABEL="https-fix-$(date +%s)"
        echo "Deploy com label: $LABEL"
        eb deploy radio-importante-backend-prod --label $LABEL --timeout 20
