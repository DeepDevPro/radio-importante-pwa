name: Deploy to Digital Ocean

on:
  push:
    branches: [ "main" ]
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "admin.html"
      - "admin-*.html"
      - "vite.config.ts"
      - "package.json"
      - "package-lock.json"
      - "styles/**"
      - "scripts/**"
  workflow_dispatch:

concurrency:
  group: deploy-digitalocean-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Deploy to Digital Ocean
        uses: digitalocean/app_action@v1.1.5
        with:
          app_name: radio-importante-frontend
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}