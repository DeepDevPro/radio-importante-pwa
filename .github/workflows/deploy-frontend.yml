name: Deploy Frontend

on:
  push:
    branches: [ "main" ]
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "admin.html"
      - "admin-*.html"
      - "styles/**"
      - "scripts/**"
      - "vite.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-frontend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: AWS CLI version
        run: aws --version

      - name: Sync dist to S3
        run: |
          aws s3 sync dist/ s3://$S3_BUCKET \
            --delete \
            --exclude ".DS_Store" \
            --exclude ".*" \
            --exclude "*.map"

      - name: Normalize metadata
        run: |
          chmod +x scripts/s3-update-metadata.sh
          ./scripts/s3-update-metadata.sh -b "$S3_BUCKET" --all

      - name: Invalidate critical paths on CloudFront
        env:
          CF_DIST_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          if [ -n "$CF_DIST_ID" ]; then
            echo "🚀 Criando CloudFront invalidation..."
            aws cloudfront create-invalidation \
              --distribution-id "$CF_DIST_ID" \
              --paths \
                "/index.html" \
                "/admin.html" \
                "/manifest.webmanifest" \
                "/sw.js" \
                "/scripts/*" \
                "/styles/*" \
                "/data/*"
            echo "✅ CloudFront invalidation criada com sucesso!"
          else
            echo "CLOUDFRONT_DISTRIBUTION_ID not set; skipping invalidation"
          fi
