# Configuração específica para upload streaming
# Contexto: location (dentro do bloco server do EB)

location /api/upload {
    # CRÍTICO: Stream direto para Node.js sem buffering
    proxy_request_buffering off;
    proxy_buffering         off;
    
    # Headers para debug
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host $http_host;
    
    # Timeouts específicos para upload (permitidos em location)
    proxy_connect_timeout 60s;
    proxy_send_timeout    600s;  # 10 minutos para upload
    proxy_read_timeout    600s;  # 10 minutos para processar
}

# Também aplicar para outras rotas da API que podem ter payloads grandes
location /api/ {
    proxy_request_buffering off;
    proxy_buffering         off;
    
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host $http_host;
}
